version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: transcript-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - transcript-network

  # Transcript Chatbot API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcript-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - VECTOR_STORE_TYPE=qdrant
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - transcript-network
    command: python run_server.py

  # Optional: PostgreSQL (if using pgvector instead of Qdrant)
  # postgres:
  #   image: ankane/pgvector:latest
  #   container_name: transcript-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #     - POSTGRES_DB=transcripts_db
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - transcript-network

volumes:
  qdrant_data:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  transcript-network:
    driver: bridge
